<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEST GRADIENT 999</title>

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: red;
    }

    .viewer-area {
      width: 100vw;
      height: 80vh;
      background: linear-gradient(135deg, red, yellow, lime, cyan, blue, purple);
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent !important;
      --poster-color: transparent;
    }

    .info {
      padding: 20px;
      background: black;
      color: white;
    }

    .info h2 {
      margin: 0 0 8px;
      font-size: 32px;
    }
  </style>
</head>

<body>
  <div class="viewer-area">
    <model-viewer
      src="./model.glb?v=999"
      ios-src="./model.usdz"
      alt="AR system model"
      camera-controls
      auto-rotate
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      camera-orbit="45deg 65deg 8m"
      field-of-view="30deg"
      exposure="1"
      shadow-intensity="1">
    </model-viewer>
  </div>

  <div class="info">
    <h2>TEST GRADIENT 999</h2>
    <p>If you do not see this black box and rainbow background, Netlify is not using your new index.html.</p>
  </div>
</body>
</html>
