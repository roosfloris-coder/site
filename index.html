<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Model</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 80vh;
      background: #ddd;
    }

    .info {
      padding: 12px;
    }
  </style>
</head>

<body>
  <model-viewer
    src="./model.glb"
    ios-src="./model.usdz"
    alt="AR system model"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-orbit="45deg 65deg 8m"
    field-of-view="30deg"
    exposure="1"
    shadow-intensity="1">
  </model-viewer>

  <div class="info">
    <h2>AR System Model</h2>
    <p>Open this page on your phone and tap the AR button.</p>
  </div>
</body>
</html>
