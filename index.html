<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Model Test</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 80vh;
      background: #ddd;
    }

    .info {
      padding: 12px;
    }
  </style>
</head>

<body>
  <model-viewer
    id="viewer"
    src="./model.glb"
    alt="3D model"
    scale="0.001 0.001 0.001"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-orbit="45deg 65deg 8m"
    field-of-view="30deg"
    exposure="1"
    shadow-intensity="1">

    <div slot="poster">Loading model...</div>
    <div slot="error">Model failed to load. Check file name and path.</div>
  </model-viewer>

  <script>
    const viewer = document.querySelector('#viewer');

    viewer.addEventListener('load', () => {
      console.log('GLB loaded successfully');
    });

    viewer.addEventListener('error', (event) => {
      console.error('GLB failed to load', event);
    });
  </script>

  <div class="info">
    <h2>AR Model Test</h2>
    <p>If the model appears here, tap the AR button on your phone.</p>
  </div>
</body>
</html>
